<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registan | LC Jizzax — Matematika</title>
<meta name="description" content="Registan LC Jizzax matematika o'quv platformasi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --bg:#f5f6fb; --surface:#ffffff; --surface2:#eef1f8; --surface3:#e6eaf4;
  --text:#101322; --muted:#5d6580; --border:#e2e6f1;
  --accent:#5b5bd6; --accent2:#8b5cf6; --accent-soft:#ecebff;
  --ok:#0f9d58; --ok-soft:#e4f6ec; --warn:#d97706; --warn-soft:#fdf1df; --err:#dc2626; --err-soft:#fdeaea;
  --shadow:0 1px 2px rgba(16,19,34,.06),0 8px 24px rgba(16,19,34,.06);
  --shadow-lg:0 24px 60px rgba(16,19,34,.18);
  --r:16px; --r-sm:10px; --r-lg:22px;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090b12; --surface:#141825; --surface2:#1b2030; --surface3:#242b3e;
    --text:#e9ecf8; --muted:#98a1bd; --border:#272e42;
    --accent:#7c7cf0; --accent2:#a78bfa; --accent-soft:#232445;
    --ok:#34d399; --ok-soft:#15302a; --warn:#fbbf24; --warn-soft:#332711; --err:#f87171; --err-soft:#3a1c1c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 24px 60px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#090b12; --surface:#141825; --surface2:#1b2030; --surface3:#242b3e;
  --text:#e9ecf8; --muted:#98a1bd; --border:#272e42;
  --accent:#7c7cf0; --accent2:#a78bfa; --accent-soft:#232445;
  --ok:#34d399; --ok-soft:#15302a; --warn:#fbbf24; --warn-soft:#332711; --err:#f87171; --err-soft:#3a1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.55; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:252px;flex:0 0 252px;background:var(--surface);border-right:1px solid var(--border);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px 24px;z-index:40;
}
.brand{display:flex;gap:11px;align-items:center;padding:6px 10px 16px}
.brand-logo{
  width:40px;height:40px;border-radius:12px;flex:0 0 40px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;
  box-shadow:0 6px 18px rgba(91,91,214,.35)
}
.brand-t{font-weight:800;font-size:14.5px;letter-spacing:-.2px;line-height:1.2}
.brand-s{font-size:11.5px;color:var(--muted);font-weight:500}
.nav-group{margin-top:12px}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;padding:8px 12px 5px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:11px;
  background:none;border:0;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);
  transition:background .16s,color .16s,transform .16s;text-align:left
}
.nav-item .ic{font-size:16px;width:20px;text-align:center;flex:0 0 20px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:35;display:flex;gap:10px;align-items:center;
  padding:11px 20px;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--border)
}
.burger{display:none}
.searchbox{flex:1;max-width:520px;position:relative}
.searchbox input{
  width:100%;padding:9px 14px 9px 36px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);outline:none;font-size:14px;transition:border-color .16s,box-shadow .16s
}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5;font-size:14px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;
  background:var(--surface);border:1px solid var(--border);font-size:12.5px;font-weight:650;white-space:nowrap
}
.chip.fire{color:var(--warn)} .chip.xp{color:var(--accent)}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:1px solid var(--border);background:var(--surface);
  cursor:pointer;display:grid;place-items:center;font-size:16px;transition:background .16s,transform .16s
}
.icon-btn:hover{background:var(--surface2)} .icon-btn:active{transform:scale(.93)}
.view{padding:22px 22px 110px;max-width:1180px;width:100%;margin:0 auto;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Bottom nav ---------- */
.bottomnav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);
  border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav .bn{
  flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:600
}
.bottomnav .bn .ic{font-size:18px;line-height:1}
.bottomnav .bn.active{color:var(--accent)}
.scrim{display:none;position:fixed;inset:0;background:rgba(6,8,16,.5);z-index:39;backdrop-filter:blur(2px)}

/* ---------- Cards & UI ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card.pad-sm{padding:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:25px;font-weight:800;letter-spacing:-.6px;margin:0 0 4px}
h2{font-size:18px;font-weight:750;letter-spacing:-.3px;margin:0 0 10px}
h3{font-size:15px;font-weight:700;margin:0 0 6px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;font-weight:600;
  transition:transform .14s,background .16s,box-shadow .16s
}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(91,91,214,.3)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.easy{background:var(--ok-soft);color:var(--ok)}
.pill.med{background:var(--warn-soft);color:var(--warn)}
.pill.hard{background:var(--err-soft);color:var(--err)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=number],input[type=search],select,textarea{
  padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface);outline:none;
  transition:border-color .16s,box-shadow .16s;width:100%
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.fl{display:block;font-size:12.5px;font-weight:650;color:var(--muted);margin-bottom:5px}

/* progress */
.bar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.ok>i{background:linear-gradient(90deg,var(--ok),#5ad19a)}
.ring{--p:0;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:0 0 96px;
  background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface3) 0)}
.ring>span{width:74px;height:74px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800;font-size:18px}

/* stat */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-size:23px;font-weight:800;letter-spacing:-.8px;margin-top:2px}
.stat .d{font-size:11.5px;color:var(--muted)}

.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:26px;color:#fff;
  background:linear-gradient(135deg,#5b5bd6,#8b5cf6 55%,#c084fc);box-shadow:0 18px 44px rgba(91,91,214,.32)
}
.hero:before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.13);top:-130px;right:-60px}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1);bottom:-110px;right:110px}
.hero h1{font-size:26px;margin-bottom:6px;position:relative}
.hero p{position:relative;margin:0;opacity:.92;font-size:14px}
.hero .row{position:relative;margin-top:18px}
.hero .btn{background:rgba(255,255,255,.95);color:#4b3fd1;border:0;font-weight:700}
.hero .btn.g{background:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(6px)}

.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:11px}
.qbtn{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:15px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:650;
  transition:transform .18s,box-shadow .18s,border-color .18s
}
.qbtn .e{font-size:23px}
.qbtn:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}

.tcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;
  transition:transform .18s,box-shadow .18s,border-color .18s;display:flex;flex-direction:column;gap:9px
}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.tcard .ico{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:18px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:99px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tab.active{background:var(--accent);color:#fff;border-color:transparent}

.prose{font-size:14.5px;line-height:1.75}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.prose li{margin-bottom:4px}
.fbox{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;margin:10px 0;overflow-x:auto}
.katex{font-size:1.06em}
.katex-display{margin:.4em 0!important;overflow-x:auto;overflow-y:hidden;padding:2px 0}

.q-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.opt{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;margin-bottom:8px;font-size:14px;
  transition:border-color .15s,background .15s,transform .12s
}
.opt:hover{border-color:var(--accent);background:var(--surface2)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--err);background:var(--err-soft)}
.opt .lt{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--surface3);display:grid;place-items:center;font-size:12px;font-weight:700}
.feedback{border-radius:12px;padding:13px 15px;margin-top:12px;font-size:14px;border:1px solid}
.feedback.good{background:var(--ok-soft);border-color:var(--ok);color:var(--text)}
.feedback.bad{background:var(--err-soft);border-color:var(--err);color:var(--text)}
.feedback.info{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.steps{counter-reset:s;margin:10px 0 0;padding:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 34px;border-bottom:1px dashed var(--border)}
.steps li:last-child{border-bottom:0}
.steps li:before{content:counter(s);position:absolute;left:0;top:8px;width:23px;height:23px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11.5px;font-weight:800}

.audiobar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:9px 11px}
.audiobar .ab{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:14px}
.audiobar .ab.play{background:var(--accent);color:#fff;border-color:transparent;width:38px;height:38px;font-size:15px}
.audiobar input[type=range]{width:110px;accent-color:var(--accent);flex:1;min-width:80px}

.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:19px}
.timer.warn{color:var(--err);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

.msg{max-width:88%;padding:11px 14px;border-radius:16px;margin-bottom:10px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{margin-left:auto;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:5px}
.msg.ai{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:5px}
.msg.ai .katex{color:var(--text)}
.chatlog{min-height:220px;max-height:min(52vh,460px);overflow-y:auto;padding:4px 2px}

.pdfstage{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px;overflow:auto;display:grid;place-items:center;min-height:320px}
#pdfCanvas{max-width:100%;border-radius:8px;box-shadow:var(--shadow);background:#fff}
.dropzone{border:2px dashed var(--border);border-radius:var(--r);padding:34px 20px;text-align:center;cursor:pointer;transition:border-color .2s,background .2s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}

.empty{text-align:center;padding:42px 18px;color:var(--muted)}
.empty .e{font-size:40px;display:block;margin-bottom:8px}
.spinner{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--surface3);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block;vertical-align:-5px}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{background:linear-gradient(90deg,var(--surface2),var(--surface3),var(--surface2));background-size:200% 100%;animation:sk 1.3s infinite;border-radius:10px;height:14px}
@keyframes sk{to{background-position:-200% 0}}

.badge-card{display:flex;gap:11px;align-items:center;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--surface)}
.badge-card.locked{opacity:.45;filter:grayscale(1)}
.badge-card .e{font-size:26px}

.modal-back{position:fixed;inset:0;background:rgba(6,8,16,.55);z-index:80;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px);animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-lg);padding:20px;animation:pop .24s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.94) translateY(12px);opacity:0}to{transform:none;opacity:1}}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px 16px;box-shadow:var(--shadow-lg);font-size:13.5px;font-weight:600;animation:up .3s;display:flex;gap:8px;align-items:center}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.toast.xp{border-color:var(--accent);color:var(--accent)}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tblwrap{overflow-x:auto}
.checkline{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px;cursor:pointer}
.checkline.done{background:var(--ok-soft);border-color:var(--ok)}
.checkline .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;flex:0 0 22px;font-size:12px}
.checkline.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.switch{position:relative;width:44px;height:25px;border-radius:99px;background:var(--surface3);cursor:pointer;transition:background .2s;border:0;flex:0 0 44px}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)} .switch.on:after{transform:translateX(19px)}
.srow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border-bottom:0}
.sr-res{border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:var(--surface);transition:border-color .15s}
.sr-res:hover{border-color:var(--accent)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}

@media (max-width:1000px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}
  .scrim.show{display:block}
  .burger{display:grid}
  .bottomnav{display:flex}
  .view{padding:16px 14px 104px}
  h1{font-size:21px} .hero{padding:20px;border-radius:18px} .hero h1{font-size:21px}

"use strict";

/* ---------- Kichik yordamchi funksiyalar ---------- */
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const nz = (a, b) => { let x = 0; while (x === 0) x = ri(a, b); return x; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const gcd = (a, b) => (b ? gcd(b, Math.abs(a % b)) : Math.abs(a));
const sg = n => (n === 0 ? "" : (n < 0 ? "- " + Math.abs(n) : "+ " + n));
const sgt = n => (n < 0 ? "-" + Math.abs(n) : "+" + n);
/* koeffitsientli had: 1x -> x, -1x -> -x, 0x -> "" */
const lead = (n, v) => (n === 1 ? v : n === -1 ? "-" + v : n + v);
const sgv = (n, v) => (n === 0 ? "" : n < 0 ? "- " + (Math.abs(n) === 1 ? "" : Math.abs(n)) + v : "+ " + (n === 1 ? "" : n) + v);
const shuffle = a => { const c = a.slice(); for (let i = c.length - 1; i > 0; i--) { const j = ri(0, i);[c[i], c[j]] = [c[j], c[i]]; } return c; };
const num = n => { const r = Math.round(n * 1000) / 1000; return String(r); };
const uniq = a => [...new Set(a)];

/* variantli savol yasash: to'g'ri javob + chalg'ituvchilar */
function mcq(ans, wrongs) {
  const opts = uniq([String(ans), ...wrongs.map(String)]).slice(0, 4);
  let i = 1;
  while (opts.length < 4) { const c = String(Number(ans) + i * (i % 2 ? 1 : -1)); if (!opts.includes(c)) opts.push(c); i++; }
  return { options: shuffle(opts), answer: String(ans), type: "mcq" };
}
function near(v, k = 4) {
  const o = [];
  for (let i = 0; i < k; i++) { const d = nz(-4, 4); const c = Math.round((v + d) * 100) / 100; if (c !== v) o.push(c); }
  return uniq(o);
}

    }
    if (L === 2) {
      const a = ri(2, 9) * ri(2, 6), b = ri(2, 9) * ri(2, 6);
      const g = gcd(a, b), l = a * b / g;
      return { text: `$${a}$ va $${b}$ sonlarining EKUK ini toping.`, type: "input", answer: String(l), hint: "EKUK$(a,b)=\\frac{a\\cdot b}{\\text{EKUB}(a,b)}$", steps: [`EKUB$(${a},${b})=${g}$`, `EKUK$=\\frac{${a}\\cdot${b}}{${g}}$`, `$=${l}$`] };
    }
    const base = ri(20, 80) * 10, p = pick([15, 20, 25, 40]);
    const v = base + base * p / 100;
    return { text: `$${base}$ soni $${p}\\%$ ga oshirildi. Yangi qiymatni toping.`, type: "input", answer: String(v), hint: `Oshgan miqdor $=\\frac{${base}\\cdot${p}}{100}$`, steps: [`$${base}$ ning $${p}\\%$ i $=\\frac{${base}\\cdot${p}}{100}=${base * p / 100}$`, `$${base}+${base * p / 100}=${v}$`] };
  },
  kasrlar(L) {
    if (L === 1) {
      const b = pick([2, 3, 4, 5, 6]), d = pick([2, 3, 4, 6, 8]);
      const a = ri(1, b - 1) || 1, c = ri(1, d - 1) || 1;
      let s = a * d + c * b, m = b * d; const g = gcd(s, m); s /= g; m /= g;
      return { text: `Hisoblang: $\\dfrac{${a}}{${b}}+\\dfrac{${c}}{${d}}$ (javobni $\\frac{p}{q}$ ko'rinishida, masalan 7/12)`, type: "input", answer: `${s}/${m}`, hint: "Umumiy maxrajga keltiring: $\\frac{ad+bc}{bd}$", steps: [`$\\frac{${a}}{${b}}+\\frac{${c}}{${d}}=\\frac{${a}\\cdot${d}+${c}\\cdot${b}}{${b * d}}$`, `$=\\frac{${a * d + c * b}}{${b * d}}$`, `Qisqartiramiz: $\\frac{${s}}{${m}}$`] };

    }
    const w = ri(1, 4), b = pick([3, 4, 5, 6]), a = ri(1, b - 1) || 1;

  },
  darajalar(L) {

      const a = pick([2, 3, 5]), m = ri(2, 4), n = ri(2, 4);

  },

function deepMerge(base, over) {
  if (over === null || over === undefined) return base;
  if (base === null || base === undefined) return over;
  if (Array.isArray(base)) return Array.isArray(over) ? over : base;
  if (typeof base !== "object" || typeof over !== "object") return over;
  const out = { ...base };
  for (const k in over) out[k] = (k in base) ? deepMerge(base[k], over[k]) : over[k];

}

async function hashPass(pass, salt) {
  const raw = salt + ":" + pass;
  if (window.crypto && crypto.subtle && crypto.subtle.digest) {
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(raw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

    if (pass !== pass2) { this.err = "Parollar bir xil emas"; return this.paint(); }
    const accs = loadAccounts();
    if (accs[email]) { this.err = "Bu email bilan hisob allaqachon mavjud. \"Kirish\" bo'limidan foydalaning."; this.tab = "login"; return this.paint(); }
    if (Object.values(accs).some(a => (a.username || "").toLowerCase() === username.toLowerCase())) {
      this.err = "Bu username band. Boshqasini tanlang."; return this.paint();
    }
    this.busy = true; this.err = ""; this.paint();
    const salt = randSalt();
    const hash = await hashPass(pass, salt);
    accs[email] = { username, salt, hash, created: new Date().toISOString() };
    saveAccounts(accs);
    this.busy = false;
    rememberSession(email, true);
    startSession(email, username, true);
  },
  async login(identifier, pass, remember) {
    if (!identifier || !pass) { this.err = "Login va parolni kiriting"; return this.paint(); }
    const accs = loadAccounts();
    const found = findAccount(accs, identifier);
    if (!found) { this.err = "Bu login bilan hisob topilmadi. Ro'yxatdan o'ting."; this.tab = "register"; return this.paint(); }
    this.busy = true; this.err = ""; this.paint();
    const hash = await hashPass(pass, found.acc.salt);
    this.busy = false;
    if (hash !== found.acc.hash) { this.err = "Login yoki parol noto'g'ri"; this.paint(); return; }
    rememberSession(found.email, remember);
    startSession(found.email, found.acc.username, false);
  },
  logout() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { }
    try { sessionStorage.removeItem(SESSION_KEY); } catch (e) { }
    location.reload();
  }
};
function rememberSession(email, remember) {
  try {
    if (remember) { localStorage.setItem(SESSION_KEY, email); sessionStorage.removeItem(SESSION_KEY); }
    else { sessionStorage.setItem(SESSION_KEY, email); localStorage.removeItem(SESSION_KEY); }
  } catch (e) { }
}

/* ---------- Sana / streak ---------- */
const today = () => new Date().toISOString().slice(0, 10);
function touchDay() {
  const t = today();
  if (S.daily.date !== t) { S.daily = { date: t, solved: 0, minutes: 0, challengeDone: false, challengeIdx: dayIndex() }; }
  if (S.lastActive !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak = (S.lastActive === y) ? S.streak + 1 : 1;
    S.maxStreak = Math.max(S.maxStreak, S.streak);
    S.lastActive = t;
    S.history.push({ date: t, solved: 0, correct: 0, xp: 0 });
    if (S.history.length > 60) S.history = S.history.slice(-60);
  }
  if (!S.history.length || S.history[S.history.length - 1].date !== t) S.history.push({ date: t, solved: 0, correct: 0, xp: 0 });
  save();
}
const dayIndex = () => Math.floor(Date.now() / 864e5);

const xpForLevel = l => 100 * l * (l + 1) / 2;   // 1→100, 2→300, 3→600 ...
function levelFromXp(xp) { let l = 1; while (xp >= xpForLevel(l)) l++; return l; }
function addXp(n, why) {
  S.xp += n;
  const nl = levelFromXp(S.xp);
  const up = nl > S.level; S.level = nl;
  const h = S.history[S.history.length - 1]; if (h) h.xp += n;
  save(); paintTop();
  toast(`⚡ +${n} XP${why ? " · " + why : ""}`, "xp");
  if (up) setTimeout(() => showModal(`<div style="text-align:center"><div style="font-size:52px">🎉</div><h2>Yangi daraja!</h2><p class="sub">Siz <b>${nl}-darajaga</b> ko'tarildingiz. Zo'r ish!</p><button class="btn primary block" onclick="closeModal()">Davom etish</button></div>`), 400);

/* ---------- KaTeX render ---------- */
function tex(str, display) {
  if (typeof katex === "undefined") return escapeHtml(str);
  try { return katex.renderToString(str, { displayMode: !!display, throwOnError: false, output: "html" }); }
  catch (e) { return escapeHtml(str); }
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
/* inline onclick ichidagi JS satri uchun xavfsiz qochirish */
function jss(s) { return escapeHtml(String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'")); }
/* $...$ va $$...$$ larni render qiladi */
function md(str) {
  if (str == null) return "";
  let s = escapeHtml(str);
  s = s.replace(/\$\$([\s\S]+?)\$\$/g, (_, m) => tex(unesc(m), true));
  s = s.replace(/\$([^$\n]+?)\$/g, (_, m) => tex(unesc(m), false));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  return s;
}
function unesc(s) { return s.replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&#39;/g, "'"); }
/* Matematikani ovoz uchun o'zbekcha matnga aylantirish */
function texToSpeech(str) {
  return String(str)
    .replace(/\$\$?([\s\S]*?)\$\$?/g, (_, m) => " " + m + " ")
    .replace(/\\dfrac|\\frac/g, " kasr ")
    .replace(/\\sqrt/g, " kvadrat ildiz ")
    .replace(/\\cdot|\\times/g, " karra ")
    .replace(/\\pm/g, " plyus minus ")
    .replace(/\\pi/g, " pi ")
    .replace(/\\alpha/g, " alfa ").replace(/\\beta/g, " beta ").replace(/\\gamma/g, " gamma ")
    .replace(/\\sin/g, " sinus ").replace(/\\cos/g, " kosinus ").replace(/\\tan/g, " tangens ")
    .replace(/\\log/g, " logarifm ").replace(/\\ln/g, " natural logarifm ")
    .replace(/\\ge/g, " katta yoki teng ").replace(/\\le/g, " kichik yoki teng ")
    .replace(/\\neq/g, " teng emas ").replace(/\\infty/g, " cheksizlik ")
    .replace(/\^\{?2\}?/g, " kvadrat ").replace(/\^\{?3\}?/g, " kub ")
    .replace(/\^/g, " daraja ").replace(/_/g, " indeks ")
    .replace(/\\circ/g, " gradus ")
    .replace(/[\\{}]/g, " ")
    .replace(/\+/g, " plyus ").replace(/-/g, " minus ")
    .replace(/=/g, " teng ")
    .replace(/\s+/g, " ").trim();
}

/* ---------- AUDIO (Text-to-Speech) ---------- */
const Audio_ = {
  utter: null, text: "", paused: false, supported: ("speechSynthesis" in window),
  voice: null,
  init() {
    if (!this.supported) return;
    const pickVoice = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /uz/i.test(v.lang)) || vs.find(v => /ru/i.test(v.lang)) || vs.find(v => /tr/i.test(v.lang)) || vs.find(v => /en/i.test(v.lang)) || vs[0] || null;
    };
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  },
  speak(raw) {
    if (!S.settings.tts) { toast("🔇 Audio sozlamalarda o'chirilgan"); return; }
    if (!this.supported) { toast("⚠️ Brauzeringiz ovozli o'qishni qo'llamaydi"); return; }
    this.stop();
    const txt = texToSpeech(raw);
    if (!txt) return;
    this.text = txt;
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = this.voice && this.voice.lang ? this.voice.lang : "uz-UZ";
    if (this.voice) u.voice = this.voice;
    u.rate = Number(S.settings.rate) || 1;
    u.onend = () => { this.paused = false; paintAudioBtns(false); };
    u.onerror = () => { this.paused = false; paintAudioBtns(false); };
    this.utter = u;
    speechSynthesis.speak(u);
    paintAudioBtns(true);
  },
  toggle(raw) {
    if (!this.supported) { toast("⚠️ Audio qo'llab-quvvatlanmaydi"); return; }
    if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); this.paused = true; paintAudioBtns(false); }
    else if (speechSynthesis.paused) { speechSynthesis.resume(); this.paused = false; paintAudioBtns(true); }
    else this.speak(raw);
  },
  stop() { if (this.supported) { speechSynthesis.cancel(); } this.paused = false; paintAudioBtns(false); }
};
Audio_.init();
function paintAudioBtns(playing) {
  document.querySelectorAll("[data-audio-play]").forEach(b => { b.textContent = playing ? "⏸" : "▶"; });
}

/* ---------- Javobni tekshirish ---------- */
function normAns(v) {
  let s = String(v).trim().toLowerCase().replace(/\s+/g, "").replace(/,/g, ".");
  s = s.replace(/^\+/, "");
  if (/^-?\d+\/\d+$/.test(s)) {           // kasrni qisqartirish
    const [p, q] = s.split("/").map(Number);
    const g = gcd(p, q) || 1;
    return (q / g === 1) ? String(p / g) : `${p / g}/${q / g}`;
  }
  if (/^-?\d*\.?\d+$/.test(s)) { const n = Number(s); return String(Math.round(n * 1000) / 1000); }
  return s;
}
function isCorrect(user, answer) {
  const a = normAns(user), b = normAns(answer);
  if (a === b) return true;
  const na = Number(a.includes("/") ? a.split("/")[0] / a.split("/")[1] : a);
  const nb = Number(b.includes("/") ? b.split("/")[0] / b.split("/")[1] : b);
  if (!isNaN(na) && !isNaN(nb)) return Math.abs(na - nb) < 1e-6;
  return false;
}

/* ---------- Statistikani yangilash ---------- */
function recordAttempt(topicId, ok, problem, userAns) {
  touchDay();
  S.attempts++; S.solved++;
  if (ok) S.correct++;
  const t = S.topicStats[topicId] || (S.topicStats[topicId] = { a: 0, c: 0 });
  t.a++; if (ok) t.c++;
  S.daily.solved++;
  const h = S.history[S.history.length - 1];
  if (h) { h.solved++; if (ok) h.correct++; }
  if (!ok && problem) {
    S.mistakes.unshift({
      id: "m" + Date.now() + Math.random().toString(36).slice(2, 5),
      topic: topicId, text: problem.text, user: String(userAns), answer: problem.answer,
      steps: problem.steps, date: today(), type: problem.type, options: problem.options || null
    });
    if (S.mistakes.length > 200) S.mistakes.length = 200;
  }
  save(); paintTop();
  if (S.daily.solved === (S.settings.dailyGoal || 10)) {
    addXp(50, "Kunlik maqsad bajarildi!");
  }
}
function accuracy() { return S.attempts ? Math.round(S.correct / S.attempts * 100) : 0; }
function topicProgress(id) {
  const t = S.topicStats[id];
  if (!t) return 0;
  return Math.min(100, Math.round(t.c / 15 * 100));
}
function overallProgress() {
  const vals = TOPICS.map(t => topicProgress(t.id));
  return Math.round(vals.reduce((a, b) => a + b, 0) / TOPICS.length);
}

/* ---------- Grafik (inline SVG) ---------- */
function lineChart(data, labels, opts) {
  opts = opts || {};
  const W = 640, H = 200, pad = 28;
  if (!data.length) return `<div class="empty small">Ma'lumot yo'q</div>`;
  const max = Math.max(1, ...data);
  const step = data.length > 1 ? (W - pad * 2) / (data.length - 1) : 0;
  const pts = data.map((v, i) => [pad + i * step, H - pad - (v / max) * (H - pad * 2)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = path + ` L ${pts[pts.length - 1][0].toFixed(1)} ${H - pad} L ${pad} ${H - pad} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik">
    <defs><linearGradient id="gr1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0, .5, 1].map(f => `<line x1="${pad}" x2="${W - pad}" y1="${H - pad - f * (H - pad * 2)}" y2="${H - pad - f * (H - pad * 2)}" stroke="var(--border)" stroke-width="1"/>`).join("")}
    <path d="${area}" fill="url(#gr1)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"><title>${labels[i]}: ${data[i]}</title></circle>`).join("")}
  </svg>`;
}
function barChart(items) {
  if (!items.length) return `<div class="empty small">Ma'lumot yo'q</div>`;
  return `<div style="display:flex;flex-direction:column;gap:9px">` + items.map(it =>
    `<div><div class="spread small" style="margin-bottom:3px"><span>${escapeHtml(it.name)}</span><span class="muted">${it.value}%</span></div>
     <div class="bar${it.value >= 70 ? " ok" : ""}"><i style="width:${Math.max(2, it.value)}%"></i></div></div>`).join("") + `</div>`;
}

function render() {
  touchDay();
  paintTop();
  const fn = VIEWS[route.name] || VIEWS.home;
  try { fn(route.param); }
  catch (e) {
    console.error(e);

      <p class="sub">${escapeHtml(e.message)}</p><button class="btn primary" onclick="go('home')">Bosh sahifaga</button></div>`;
  }
}

function bookmarkFormula(topicId, i) {
  const t = TOPIC_BY_ID[topicId]; if (!t) return;
  toggleBookmark("formula", topicId + "-" + i, t.name + " formulasi", t.formulas[i]);
}
function stat(k, v, d) { return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`; }
function levelPct() {
  const prev = S.level > 1 ? xpForLevel(S.level - 1) : 0;
  const nxt = xpForLevel(S.level);
  return Math.max(0, Math.min(100, Math.round((S.xp - prev) / (nxt - prev) * 100)));
}
function emptyBox(e, t, d, act, actLabel) {
  return `<div class="card empty"><span class="e">${e}</span><h2>${t}</h2><p class="sub">${d}</p>
    ${act ? `<button class="btn primary" onclick="${act}">${actLabel}</button>` : ""}</div>`;
}

/* ============================================================
   MASALA MOTORI (Problem Engine)
   ============================================================ */
const PE = {
  topic: null, level: 1, p: null, answered: false, userAns: "", selected: null, hintShown: false,
  next(silent) {
    const gen = GEN[this.topic];
    if (!gen) { this.p = null; return; }
    let p = null, tries = 0;
    do { p = gen(this.level); tries++; } while (!p && tries < 5);
    this.p = p; this.answered = false; this.userAns = ""; this.selected = null; this.hintShown = false;
    if (!silent) this.paint();
  },
  paint() {
    const t = TOPIC_BY_ID[this.topic];
    const lvlName = ["", "🟢 Oson", "🟡 O'rta", "🔴 Qiyin"][this.level];
    const lvlCls = ["", "easy", "med", "hard"][this.level];
    if (!this.p) { V.innerHTML = emptyBox("😕", "Masala yaratilmadi", "Boshqa mavzuni tanlang.", "go('topics')", "Mavzular"); return; }
    const st = S.topicStats[this.topic] || { a: 0, c: 0 };
    V.innerHTML = `
      <div class="spread">
        <div><h1 style="margin:0">🧮 Masalalar</h1>
        <p class="sub" style="margin:2px 0 0">${t.icon} ${t.name} · ${st.c}/${st.a} to'g'ri</p></div>
        <button class="btn sm ghost" onclick="go('topic','${this.topic}')">📘 Nazariya</button>
      </div>
      <div class="row" style="margin-bottom:12px">
        <select onchange="PE.topic=this.value;PE.next()" style="max-width:230px">
          ${TOPICS.map(x => `<option value="${x.id}" ${x.id === this.topic ? "selected" : ""}>${x.icon} ${x.name}</option>`).join("")}
        </select>
        ${[1, 2, 3].map(l => `<button class="tab ${l === this.level ? "active" : ""}" onclick="PE.level=${l};PE.next()">${["", "🟢 Oson", "🟡 O'rta", "🔴 Qiyin"][l]}</button>`).join("")}
      </div>

      <div class="q-wrap">
        <div class="spread" style="margin-bottom:10px">
          <span class="pill ${lvlCls}">${lvlName}</span>
          <div class="row" style="gap:6px">
            ${speakBtn(this.p.text, "Savolni eshitish")}
            <button class="btn sm" onclick="PE.bookmark()">☆ Saqlash</button>
          </div>
        </div>
        <div class="prose" style="font-size:16px;font-weight:600">${md(this.p.text)}</div>

        <div style="margin-top:16px" id="answerZone">${this.answerZone()}</div>
        <div id="feedZone">${this.answered ? this.feedback() : ""}</div>

        <div class="row" style="margin-top:14px">
          ${!this.answered ? `<button class="btn primary" onclick="PE.check()">✓ Tekshirish</button>
            <button class="btn" onclick="PE.hint()">💡 Ishora</button>
            <button class="btn ghost" onclick="PE.reveal()">👁 Yechimni ko'rsatish</button>`
        : `<button class="btn primary" onclick="PE.next()">Keyingi masala →</button>
            <button class="btn" onclick="askAiProblem()">🤖 AI dan so'rash</button>`}
        </div>
        ${this.hintShown && !this.answered ? `<div class="feedback info" style="margin-top:12px">💡 <b>Ishora:</b> ${md(this.p.hint)}</div>` : ""}
      </div>`;
    const inp = document.getElementById("ansInput");
    if (inp) { inp.focus(); inp.onkeydown = e => { if (e.key === "Enter") this.answered ? this.next() : this.check(); }; }
  },
  answerZone() {
    const p = this.p;
    if (p.type === "mcq") {
      return p.options.map((o, i) => {
        let cls = "";
        if (this.answered) {
          if (isCorrect(o, p.answer)) cls = "good";
          else if (this.selected === i) cls = "bad";
        } else if (this.selected === i) cls = "sel";
        return `<button class="opt ${cls}" onclick="PE.select(${i})" ${this.answered ? "disabled" : ""}>
          <span class="lt">${"ABCD"[i]}</span><span>${md(String(o))}</span></button>`;
      }).join("");
    }
    return `<label class="fl">Javobingizni kiriting</label>
      <input id="ansInput" type="text" placeholder="masalan: 12 yoki 3/4 yoki -5" value="${escapeHtml(this.userAns)}"
        oninput="PE.userAns=this.value" ${this.answered ? "disabled" : ""}>
      <div class="small muted" style="margin-top:6px">Kasr uchun <b>p/q</b> (masalan 3/4), o'nli kasr uchun nuqta yoki vergul.</div>`;
  },
  select(i) { if (this.answered) return; this.selected = i; this.userAns = this.p.options[i]; this.paint(); },
  hint() { this.hintShown = true; this.paint(); },
  check() {
    if (this.answered) return;
    if (this.p.type === "mcq" && this.selected === null) { toast("Avval variantni tanlang"); return; }
    if (this.p.type !== "mcq" && !String(this.userAns).trim()) { toast("Javobni kiriting"); return; }
    const ok = isCorrect(this.userAns, this.p.answer);
    this.answered = true; this.ok = ok;
    recordAttempt(this.topic, ok, this.p, this.userAns);
    if (ok) addXp(this.level * 10, "to'g'ri javob");
    this.paint();
  },
  reveal() {
    this.answered = true; this.ok = false;
    recordAttempt(this.topic, false, this.p, this.userAns || "(ko'rsatildi)");
    this.paint();
  },
  feedback() {
    const p = this.p, ok = this.ok;
    return `<div class="feedback ${ok ? "good" : "bad"}">
      <b>${ok ? "✅ To'g'ri!" : "❌ Noto'g'ri"}</b> ${ok ? `+${this.level * 10} XP` : `To'g'ri javob: <b>${escapeHtml(p.answer)}</b>`}
      ${!ok && this.userAns ? `<div class="small" style="margin-top:4px">Siz <b>${escapeHtml(String(this.userAns))}</b> deb yozdingiz. ${whereWrong(this.userAns, p.answer)}</div>` : ""}
    </div>
    <div class="card pad-sm" style="margin-top:12px">
      <h3>📖 To'liq yechim</h3>
      <ol class="steps">${p.steps.map(s => `<li>${md(s)}</li>`).join("")}</ol>
      ${audioBar(p.text + ". Yechim: " + p.steps.join(". "), "Yechimni eshitish")}
    </div>`;
  },
  bookmark() {
    const id = "p" + Date.now();
    toggleBookmark("problem", id, this.p.text, JSON.stringify({ topic: this.topic, level: this.level }), true);
    this.paint();
  }
};
function whereWrong(u, a) {
  const nu = Number(normAns(u)), na = Number(normAns(a));
  if (!isNaN(nu) && !isNaN(na)) {
    if (Math.abs(nu) === Math.abs(na)) return "Qiymat to'g'ri, lekin <b>ishora</b> (musbat/manfiy) noto'g'ri.";
    if (Math.abs(nu - na) <= 2) return "Javob juda yaqin — ehtimol oddiy hisoblash xatosi.";
    if (na !== 0 && Math.abs(nu / na - 2) < .01) return "Javobingiz 2 barobar katta — ehtimol <b>2 ga bo'lishni</b> unutdingiz.";
    if (nu !== 0 && Math.abs(na / nu - 2) < .01) return "Javobingiz 2 barobar kichik — ehtimol <b>2 ga ko'paytirish</b> tushib qolgan.";
  }
  return "Quyidagi yechimni diqqat bilan ko'rib chiqing.";
}

/* Xatolar daftari amallari */
function removeMistake(id) { S.mistakes = S.mistakes.filter(m => m.id !== id); save(); render(); toast("O'chirildi"); }
function clearMistakes() {
  showModal(`<h2>Xatolarni tozalash</h2><p class="sub">Barcha ${S.mistakes.length} ta yozuv o'chiriladi. Davom etasizmi?</p>
    <div class="row"><button class="btn" onclick="closeModal()">Bekor qilish</button>
    <button class="btn primary" onclick="S.mistakes=[];save();closeModal();render();toast('Tozalandi')">Ha, o'chirish</button></div>`);
}
function retryMistake(id) {
  const m = S.mistakes.find(x => x.id === id);
  if (!m) return;
  MRetry.m = m; MRetry.open();
}
const MRetry = {
  m: null, val: "",
  open() {
    const m = this.m;
    showModal(`<h2>🔁 Qayta ishlash</h2>
      <div class="prose" style="font-weight:600">${md(m.text)}</div>
      ${m.type === "mcq" && m.options ? m.options.map((o, i) => `<button class="opt" onclick="MRetry.pick('${jss(String(o))}')">${"ABCD"[i]}. ${md(String(o))}</button>`).join("")
        : `<input id="mrIn" type="text" placeholder="Javob" oninput="MRetry.val=this.value" style="margin:10px 0">`}
      <div id="mrFeed"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" onclick="MRetry.check()">Tekshirish</button>
        <button class="btn ghost" onclick="closeModal()">Yopish</button>
      </div>`);
  },
  pick(v) { this.val = v; this.check(); },
  check() {
    const ok = isCorrect(this.val, this.m.answer);
    document.getElementById("mrFeed").innerHTML = ok
      ? `<div class="feedback good"><b>✅ To'g'ri!</b> Ajoyib — bu xato tuzatildi.</div>`
      : `<div class="feedback bad"><b>❌ Hali ham noto'g'ri.</b> To'g'ri javob: <b>${escapeHtml(this.m.answer)}</b>
         <ol class="steps">${(this.m.steps || []).map(s => `<li>${md(s)}</li>`).join("")}</ol></div>`;
    if (ok) {
      S.fixed++; S.mistakes = S.mistakes.filter(x => x.id !== this.m.id);
      save(); addXp(15, "xato tuzatildi");
      setTimeout(() => { closeModal(); render(); }, 1600);
    }
  }
};

<script>

/* ============================== TEST MOTORI ============================== */
const TE = {
  cfg: { topic: "all", level: 2, count: 10, minutes: 15 },
  qs: [], idx: 0, answers: [], left: 0, timer: null, running: false, result: null,
  build() {
    const pool = this.cfg.topic === "all" ? TOPICS.map(t => t.id) : [this.cfg.topic];
    this.qs = [];
    let guard = 0;
    while (this.qs.length < this.cfg.count && guard < this.cfg.count * 20) {
      guard++;
      const tid = pool[this.qs.length % pool.length] || pick(pool);
      const gen = GEN[tid]; if (!gen) continue;
      const lvl = this.cfg.level === 0 ? ri(1, 3) : this.cfg.level;
      let p; try { p = gen(lvl); } catch (e) { continue; }
      if (!p) continue;
      if (this.qs.some(q => q.text === p.text)) continue;
      p.topic = tid; p.lvl = lvl;
      this.qs.push(p);
    }
    this.answers = new Array(this.qs.length).fill(null);
    this.idx = 0; this.result = null;
  },
  start() {
    this.build();
    if (!this.qs.length) { toast("Savollar yaratilmadi"); return; }
    this.left = this.cfg.minutes * 60;
    this.running = true;
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      this.left--;
      const el = document.getElementById("teTimer");
      if (el) { el.textContent = fmtTime(this.left); el.classList.toggle("warn", this.left <= 60); }
      if (this.left <= 0) { this.finish(true); }
    }, 1000);
    go("test"); this.paint();
  },
  paint() {
    if (this.result) return this.paintResult();
    if (!this.running) return this.paintSetup();
    if (!this.timer) this.resumeTimer();
    const q = this.qs[this.idx];
    const done = this.answers.filter(a => a !== null).length;
    V.innerHTML = `
      <div class="spread">
        <div><h1 style="margin:0">📝 Test</h1><p class="sub" style="margin:2px 0 0">Savol ${this.idx + 1} / ${this.qs.length} · javob berilgan: ${done}</p></div>
        <div class="row"><span class="timer" id="teTimer">${fmtTime(this.left)}</span>
        <button class="btn sm ghost" onclick="TE.confirmQuit()">Chiqish</button></div>
      </div>
      <div class="bar" style="margin:10px 0 16px"><i style="width:${(this.idx + 1) / this.qs.length * 100}%"></i></div>
      <div class="q-wrap">
        <div class="spread" style="margin-bottom:10px">
          <span class="pill ${["", "easy", "med", "hard"][q.lvl]}">${TOPIC_BY_ID[q.topic].icon} ${TOPIC_BY_ID[q.topic].name}</span>
          ${speakBtn(q.text, "Eshitish")}
        </div>
        <div class="prose" style="font-size:16px;font-weight:600">${md(q.text)}</div>
        <div style="margin-top:16px">
          ${q.type === "mcq"
        ? q.options.map((o, i) => `<button class="opt ${this.answers[this.idx] === String(o) ? "sel" : ""}" onclick="TE.answer('${jss(String(o))}')"><span class="lt">${"ABCD"[i]}</span><span>${md(String(o))}</span></button>`).join("")
        : `<input id="teIn" type="text" placeholder="Javobni kiriting" value="${escapeHtml(this.answers[this.idx] || "")}" oninput="TE.answer(this.value,true)">`}
        </div>
        <div class="row" style="margin-top:16px">
          <button class="btn" onclick="TE.goTo(${this.idx - 1})" ${this.idx === 0 ? "disabled" : ""}>← Oldingi</button>
          ${this.idx < this.qs.length - 1
        ? `<button class="btn primary" onclick="TE.goTo(${this.idx + 1})">Keyingi →</button>`
        : `<button class="btn primary" onclick="TE.confirmFinish()">✓ Testni yakunlash</button>`}
        </div>
      </div>
      <div class="card" style="margin-top:14px">
        <h3>Savollar xaritasi</h3>
        <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px">
          ${this.qs.map((_, i) => `<button class="btn sm" style="width:38px;padding:6px 0;${i === this.idx ? "border-color:var(--accent);" : ""}${this.answers[i] !== null ? "background:var(--accent-soft);color:var(--accent);" : ""}" onclick="TE.goTo(${i})">${i + 1}</button>`).join("")}
        </div>
      </div>`;
    const inp = document.getElementById("teIn");
    if (inp) inp.onkeydown = e => { if (e.key === "Enter" && this.idx < this.qs.length - 1) this.goTo(this.idx + 1); };
  },
  resumeTimer() {
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      this.left--;
      const el = document.getElementById("teTimer");
      if (el) { el.textContent = fmtTime(this.left); el.classList.toggle("warn", this.left <= 60); }
      if (this.left <= 0) this.finish(true);
    }, 1000);
  },
  answer(v, keep) { this.answers[this.idx] = v; if (!keep) this.paint(); },
  goTo(i) { if (i < 0 || i >= this.qs.length) return; this.idx = i; this.paint(); },
  confirmQuit() {
    showModal(`<h2>Testdan chiqish</h2><p class="sub">Natijalar saqlanmaydi. Chindan chiqasizmi?</p>
      <div class="row"><button class="btn" onclick="closeModal()">Davom etish</button>
      <button class="btn primary" onclick="TE.quit()">Ha, chiqish</button></div>`);
  },
  quit() { clearInterval(this.timer); this.running = false; this.result = null; closeModal(); this.paint(); },
  confirmFinish() {
    const un = this.answers.filter(a => a === null || a === "").length;
    showModal(`<h2>Testni yakunlash</h2><p class="sub">${un ? `<b>${un}</b> ta savolga javob berilmagan. ` : ""}Yakunlaymizmi?</p>
      <div class="row"><button class="btn" onclick="closeModal()">Orqaga</button>
      <button class="btn primary" onclick="closeModal();TE.finish()">Yakunlash</button></div>`);
  },
  finish(byTime) {
    clearInterval(this.timer); this.running = false;
    const spent = this.cfg.minutes * 60 - this.left;
    let score = 0;
    const detail = this.qs.map((q, i) => {
      const ua = this.answers[i];
      const ok = ua !== null && ua !== "" && isCorrect(ua, q.answer);
      if (ok) score++;
      recordAttempt(q.topic, ok, ok ? null : q, ua === null ? "—" : ua);
      return { q, ua, ok };
    });
    const pct = Math.round(score / this.qs.length * 100);
    const rec = {
      id: "t" + Date.now(), date: today(), topic: this.cfg.topic,
      topicName: this.cfg.topic === "all" ? "Aralash" : TOPIC_BY_ID[this.cfg.topic].name,
      score, total: this.qs.length, pct, spent, byTime: !!byTime
    };
    S.tests.unshift(rec); if (S.tests.length > 100) S.tests.length = 100;
    save();
    addXp(score * 8 + (pct === 100 ? 40 : 0), "test yakunlandi");
    this.result = { rec, detail };
    this.paintResult();
  },
  paintResult() {
    const { rec, detail } = this.result;
    const mood = rec.pct >= 80 ? ["🎉", "Ajoyib natija!"] : rec.pct >= 50 ? ["👍", "Yaxshi, lekin yaxshilash mumkin"] : ["💪", "Mashq qilish kerak"];
    V.innerHTML = `
      <div class="card" style="text-align:center">
        <div style="font-size:50px">${mood[0]}</div>
        <h1 style="margin:6px 0">${mood[1]}</h1>
        <p class="sub">${rec.topicName} · ${rec.byTime ? "vaqt tugadi" : "yakunlandi"}</p>
        <div class="row" style="justify-content:center;gap:16px;margin:14px 0">
          <div class="ring" style="--p:${rec.pct}"><span>${rec.pct}%</span></div>
          <div style="text-align:left">
            <div><b style="font-size:22px">${rec.score}/${rec.total}</b> ball</div>
            <div class="small muted">✅ To'g'ri: ${rec.score}</div>
            <div class="small muted">❌ Noto'g'ri: ${rec.total - rec.score}</div>
            <div class="small muted">⏱ Sarflangan vaqt: ${fmtTime(rec.spent)}</div>
          </div>
        </div>
        <div class="row" style="justify-content:center">
          <button class="btn primary" onclick="TE.result=null;TE.paint()">Yangi test</button>
          <button class="btn" onclick="go('mistakes')">❌ Xatolarim</button>
          <button class="btn ghost" onclick="go('progress')">📊 Progress</button>
        </div>
      </div>
      <h2 style="margin:20px 0 10px">Har bir savol yechimi</h2>
      <div class="grid" style="gap:12px">
        ${detail.map((d, i) => `
          <div class="card pad-sm" style="border-left:4px solid ${d.ok ? "var(--ok)" : "var(--err)"}">
            <div class="spread"><span class="pill ${d.ok ? "easy" : "hard"}">${i + 1}. ${d.ok ? "To'g'ri" : "Noto'g'ri"}</span>
            <span class="small muted">${TOPIC_BY_ID[d.q.topic].name}</span></div>
            <div class="prose" style="margin-top:8px">${md(d.q.text)}</div>
            <div class="row small" style="margin-top:6px">
              <span class="pill">Siz: ${escapeHtml(d.ua === null || d.ua === "" ? "—" : String(d.ua))}</span>
              <span class="pill easy">To'g'ri: ${escapeHtml(d.q.answer)}</span>
            </div>
            <details style="margin-top:8px"><summary style="cursor:pointer;font-weight:650;font-size:13.5px">Yechim</summary>
              <ol class="steps">${d.q.steps.map(s => `<li>${md(s)}</li>`).join("")}</ol></details>
          </div>`).join("")}
      </div>`;
  },
  paintSetup() {
    V.innerHTML = `
      <h1>📝 Test tizimi</h1><p class="sub">Mavzu, qiyinlik, savollar soni va vaqtni tanlang</p>
      <div class="card">
        <div class="grid g2">
          <div><label class="fl">Mavzu</label>
            <select onchange="TE.cfg.topic=this.value">
              <option value="all">🎲 Aralash (barcha mavzular)</option>
              ${TOPICS.map(t => `<option value="${t.id}" ${TE.cfg.topic === t.id ? "selected" : ""}>${t.icon} ${t.name}</option>`).join("")}
            </select></div>
          <div><label class="fl">Qiyinlik</label>
            <select onchange="TE.cfg.level=Number(this.value)">
              <option value="1" ${TE.cfg.level === 1 ? "selected" : ""}>🟢 Oson</option>
              <option value="2" ${TE.cfg.level === 2 ? "selected" : ""}>🟡 O'rta</option>
              <option value="3" ${TE.cfg.level === 3 ? "selected" : ""}>🔴 Qiyin</option>
              <option value="0" ${TE.cfg.level === 0 ? "selected" : ""}>🔀 Aralash</option>
            </select></div>
          <div><label class="fl">Savollar soni</label>
            <select onchange="TE.cfg.count=Number(this.value)">
              ${[5, 10, 15, 20, 30].map(n => `<option value="${n}" ${TE.cfg.count === n ? "selected" : ""}>${n} ta savol</option>`).join("")}
            </select></div>
          <div><label class="fl">Vaqt</label>
            <select onchange="TE.cfg.minutes=Number(this.value)">
              ${[5, 10, 15, 20, 30, 45, 60].map(n => `<option value="${n}" ${TE.cfg.minutes === n ? "selected" : ""}>${n} daqiqa</option>`).join("")}
            </select></div>
        </div>
        <button class="btn primary block" style="margin-top:16px" onclick="TE.start()">▶ Testni boshlash</button>
      </div>
      <h2 style="margin:22px 0 10px">Test tarixi</h2>
      ${S.tests.length ? `<div class="card pad-sm tblwrap"><table class="tbl">
        <tr><th>Sana</th><th>Mavzu</th><th>Ball</th><th>Foiz</th><th>Vaqt</th></tr>
        ${S.tests.slice(0, 20).map(t => `<tr><td class="muted">${t.date}</td><td>${escapeHtml(t.topicName)}</td>
          <td>${t.score}/${t.total}</td><td><span class="pill ${t.pct >= 80 ? "easy" : t.pct >= 50 ? "med" : "hard"}">${t.pct}%</span></td>
          <td class="muted">${fmtTime(t.spent)}</td></tr>`).join("")}
      </table></div>` : emptyBox("📝", "Test tarixi bo'sh", "Birinchi testingizni topshiring — natijalar shu yerda saqlanadi.", "", "")}`;
  }
};
function fmtTime(s) { s = Math.max(0, s | 0); const m = Math.floor(s / 60); return `${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function startQuickTest(topicId) { TE.cfg = { topic: topicId, level: 2, count: 10, minutes: 15 }; TE.result = null; TE.start(); }
VIEWS.test = () => TE.paint();

/* ============================== KITOB / PDF READER ============================== */
const IDB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      if (this.db) return res(this.db);
      const r = indexedDB.open("registan_books", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("files"); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async put(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction("files", "readonly"); const q = tx.objectStore("files").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async del(k) { const db = await this.open(); return new Promise(res => { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(k); tx.oncomplete = res; }); }
};

const Book = {
  doc: null, page: 1, total: 0, scale: 1.2, rendering: false, textCache: {}, loading: false,
  async loadFromBuffer(buf, name) {
    this.loading = true; VIEWS.book();
    try {
      if (typeof pdfjsLib === "undefined") throw new Error("PDF kutubxonasi yuklanmadi. Internetni tekshiring.");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      this.doc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
      this.total = this.doc.numPages;
      S.book.name = name; S.book.total = this.total;
      if (S.book.page > this.total || S.book.page < 1) S.book.page = 1;
      this.page = S.book.page;
      save();
      this.loading = false;
      VIEWS.book();
      await this.renderPage();
    } catch (e) {
      this.loading = false; this.doc = null;
      console.error(e);
      VIEWS.book();
      toast("⚠️ PDF ochilmadi: " + e.message);
    }
  },
  async onFile(file) {
    if (!file) return;
    if (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name)) { toast("⚠️ Faqat PDF fayl yuklang"); return; }
    const buf = await file.arrayBuffer();
    try { await IDB.put("current", { name: file.name, buf }); } catch (e) { toast("Kitob xotiraga saqlanmadi, lekin ochiladi"); }
    S.book.marks = []; S.book.page = 1; S.book.pagesRead = 0; save();
    await this.loadFromBuffer(buf, file.name);
  },
  async restore() {
    try {
      const rec = await IDB.get("current");
      if (rec && rec.buf) { await this.loadFromBuffer(rec.buf, rec.name); return true; }
    } catch (e) { console.warn(e); }
    return false;
  },
  async renderPage() {
    if (!this.doc || this.rendering) return;
    this.rendering = true;
    try {
      const pg = await this.doc.getPage(this.page);
      const vp = pg.getViewport({ scale: this.scale });
      const c = document.getElementById("pdfCanvas");
      if (!c) { this.rendering = false; return; }
      const ctx = c.getContext("2d");
      c.width = vp.width; c.height = vp.height;
      await pg.render({ canvasContext: ctx, viewport: vp }).promise;
      S.book.page = this.page;
      S.book.pagesRead = Math.max(S.book.pagesRead, this.page);
      save(); checkBadges();
      const lbl = document.getElementById("pgLabel"); if (lbl) lbl.textContent = `${this.page} / ${this.total}`;
      const bm = document.getElementById("bmBtn"); if (bm) bm.textContent = S.book.marks.includes(this.page) ? "★ Bookmark" : "☆ Bookmark";
    } catch (e) { console.error(e); toast("Sahifani chizishda xato"); }
    this.rendering = false;
  },
  async pageText(n) {
    n = n || this.page;
    if (this.textCache[n]) return this.textCache[n];
    if (!this.doc) return "";
    const pg = await this.doc.getPage(n);
    const tc = await pg.getTextContent();
    const s = tc.items.map(i => i.str).join(" ").replace(/\s+/g, " ").trim();
    this.textCache[n] = s;
    return s;
  },
  go(n) { if (!this.doc) return; n = Math.min(this.total, Math.max(1, n)); if (n === this.page) return; this.page = n; this.renderPage(); },
  zoom(d) { this.scale = Math.min(3, Math.max(.5, this.scale + d)); this.renderPage(); },
  mark() {
    const i = S.book.marks.indexOf(this.page);
    if (i >= 0) { S.book.marks.splice(i, 1); toast("Bookmark olib tashlandi"); }
    else { S.book.marks.push(this.page); S.book.marks.sort((a, b) => a - b); toast("⭐ " + this.page + "-sahifa saqlandi"); }
    if (!isBooked("page", "p" + this.page) && i < 0) S.bookmarks.unshift({ kind: "page", id: "p" + this.page, title: (S.book.name || "Kitob") + " — " + this.page + "-sahifa", payload: this.page, date: today() });
    else S.bookmarks = S.bookmarks.filter(b => !(b.kind === "page" && b.id === "p" + this.page));
    save(); VIEWS.book(); this.renderPage();
  },
  async search(q) {
    if (!this.doc || !q.trim()) return;
    const box = document.getElementById("bookSearchRes");
    box.innerHTML = `<div class="small muted"><span class="spinner"></span> Qidirilmoqda…</div>`;
    const res = [];
    const lim = Math.min(this.total, 120);
    for (let i = 1; i <= lim; i++) {
      const t = (await this.pageText(i)).toLowerCase();
      const k = t.indexOf(q.toLowerCase());
      if (k >= 0) res.push({ page: i, snip: (await this.pageText(i)).slice(Math.max(0, k - 50), k + 90) });
      if (res.length >= 25) break;
    }
    box.innerHTML = res.length
      ? res.map(r => `<div class="sr-res" onclick="Book.go(${r.page});closeModal()"><b>${r.page}-sahifa</b><div class="small muted">…${escapeHtml(r.snip)}…</div></div>`).join("")
      : `<div class="empty small">Hech narsa topilmadi. ${this.total > 120 ? "(dastlabki 120 sahifa qidirildi)" : ""}</div>`;
  },
  async readAloud() {
    const t = await this.pageText();
    if (!t) { toast("Bu sahifada matn topilmadi (skan qilingan bo'lishi mumkin)"); return; }
    Audio_.speak(t.slice(0, 4000));
    toast("🔊 O'qilmoqda…");
  },
  async explain() { const t = await this.pageText(); if (!t) return toast("Matn topilmadi"); AI.openWith("📚 Tushuntirib ber", `Quyidagi kitob sahifasidagi matematik mazmunni o'zbek tilida, o'quvchi tushunadigan qilib tushuntirib ber:\n\n"""${t.slice(0, 5000)}"""`); },
  async solve() { const t = await this.pageText(); if (!t) return toast("Matn topilmadi"); AI.openWith("🧠 Bosqichma-bosqich yech", `Quyidagi sahifadagi masalalarni o'zbek tilida bosqichma-bosqich yechib ber:\n\n"""${t.slice(0, 5000)}"""`); },
  async makeTest() {
    const t = await this.pageText();
    if (!t) return toast("Matn topilmadi");

const AI = {
  ready: null, fn: null, mode: "🧠 Bosqichma-bosqich yech", turns: [], busy: false, ctl: null, img: null, limits: null,
  MODES: ["🧠 Bosqichma-bosqich yech", "💡 Faqat ishora ber", "📚 Tushuntirib ber", "🔍 Xatoyimni top", "📝 O'xshash masala ber"],
  async init() {
    if (this.ready !== null) return this.fn;
    try {
      this.fn = (typeof claude !== "undefined" && claude.use) ? await claude.use("sample") : null;
    } catch (e) { this.fn = null; }
    this.ready = !!this.fn;
    if (this.fn && this.fn.limits) { try { this.limits = await this.fn.limits(); } catch (e) { } }
    return this.fn;
  },
  rules() {
    return `Sen "Registan | LC Jizzax" o'quv markazining matematika bo'yicha AI yordamchisisan. Qoidalar:
- Faqat O'ZBEK tilida (lotin alifbosida) javob ber.
- Matematik formulalarni $...$ ichida LaTeX bilan yoz (masalan $x^2+2x+1$).
- Javobni shunchaki tashlab ketma: o'quvchi tushunadigan qilib, qisqa bosqichlarga bo'lib izohla.
- Rejim: "${this.mode}". Agar rejim "Faqat ishora ber" bo'lsa, TO'LIQ yechimni berma — faqat keyingi qadamga yo'naltiruvchi ishora ber.
- Agar rejim "O'xshash masala ber" bo'lsa, shu turdagi yangi masala tuz va javobini oxirida ber.
- Javob 350 so'zdan oshmasin.`;
  },
  openWith(mode, prompt) { this.mode = mode; go("ai"); setTimeout(() => { const i = document.getElementById("aiIn"); if (i) { i.value = prompt; } this.send(prompt); }, 300); },
  async send(preset) {
    const inp = document.getElementById("aiIn");
    const text = (preset != null ? preset : (inp ? inp.value : "")).trim();
    if (!text && !this.img) return;
    if (this.busy) { toast("Javob yozilmoqda…"); return; }
    const fn = await this.init();
    if (!fn) { toast("🤖 AI hozir mavjud emas"); this.paint(); return; }
    if (inp) inp.value = "";
    this.turns.push({ role: "user", content: text || "Rasmdagi masalani yech." });
    this.busy = true; this.paint();
    const log = document.getElementById("aiLog");
    const bub = document.createElement("div");
    bub.className = "msg ai"; bub.textContent = "O'ylayapman…";
    log.appendChild(bub); log.scrollTop = log.scrollHeight;
    this.ctl = new AbortController();
    const input = [{ role: "user", content: this.rules() }, ...this.turns.slice(-10)];
    const opts = {
      signal: this.ctl.signal, cache: false, modelTier: "default",
      onText: ({ text }) => { bub.innerHTML = md(text); log.scrollTop = log.scrollHeight; }
    };
    if (this.img) { opts.images = [this.img]; }
    try {
      const { text: ans } = await fn(input, opts);
      this.turns.push({ role: "assistant", content: ans });
      this.img = null;
    } catch (e) {
      const keep = e && e.text ? e.text : "";
      const msgs = {
        not_granted: "AI dan foydalanishga ruxsat berilmadi. Sahifani yangilab, ruxsat oynasida «Allow» ni bosing.",
        rate_limited: "Juda ko'p so'rov yuborildi. Bir necha daqiqadan keyin urinib ko'ring.",
        cancelled: "To'xtatildi.",
        refused: "Bu so'rovga javob berilmadi. Savolni boshqacha yozib ko'ring.",
        session_expired: "Sessiya tugadi — Claude hisobingizga qayta kiring.",
        images_unavailable: "Bu qurilmada rasm yuborish mumkin emas.",
        empty_completion: "Javob bo'sh keldi. Savolni soddaroq yozing."
      };
      const m = msgs[e && e.code] || "Xatolik yuz berdi. Qayta urinib ko'ring.";
      bub.innerHTML = (keep ? md(keep) + "<br><br>" : "") + `<span style="color:var(--err)">⚠️ ${m}</span>`;
      if (!keep) this.turns.pop();
    }
    this.busy = false; this.ctl = null;
    this.paint();
  },
  stop() { if (this.ctl) this.ctl.abort(); },
  async pickImage(file) {
    if (!file) return;
    const fn = await this.init();
    if (!fn) return toast("AI mavjud emas");
    if (!this.limits || !this.limits.images) { toast("Bu qurilmada rasm yuborish mumkin emas"); return; }
    this.img = file;
    toast("🖼 Rasm biriktirildi — endi savolingizni yozing");
    this.paint();
  },
  paint() {
    const avail = this.ready;
    V.innerHTML = `
      <h1>🤖 AI Matematika yordamchisi</h1>
      <p class="sub">Masala yozing, rasmini yuklang yoki mavzu haqida so'rang — javob o'zbek tilida bosqichma-bosqich beriladi.</p>
      ${avail === false ? `<div class="feedback bad" style="margin-bottom:12px">⚠️ AI bu yerda mavjud emas. Saytning qolgan barcha bo'limlari (masalalar, test, kitob, formulalar) ishlashda davom etadi.</div>` : ""}
      <div class="tabs">${this.MODES.map(m => `<button class="tab ${this.mode === m ? "active" : ""}" onclick="AI.mode='${m}';AI.paint()">${m}</button>`).join("")}</div>
      <div class="card">
        <div class="chatlog" id="aiLog">
          ${!this.turns.length ? `<div class="empty small"><span class="e">💬</span>Savolingizni yozing. Masalan:<br>
            <button class="btn sm" style="margin-top:8px" onclick="AI.send('x kvadrat minus 5x plyus 6 teng 0 tenglamani yech')">$x^2-5x+6=0$ ni yech</button>
            <button class="btn sm" style="margin-top:8px" onclick="AI.send('Logarifm nima va qanday ishlatiladi?')">Logarifm nima?</button></div>`
        : this.turns.map(t => `<div class="msg ${t.role === "user" ? "me" : "ai"}">${t.role === "user" ? escapeHtml(t.content) : md(t.content)}</div>`).join("")}
        </div>
        <div class="row" style="margin-top:10px;flex-wrap:nowrap;align-items:flex-end">
          <textarea id="aiIn" rows="2" placeholder="Masalani yoki savolni yozing…" style="flex:1;resize:vertical"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();AI.send()}"></textarea>
          ${this.busy
        ? `<button class="btn" onclick="AI.stop()">⏹ To'xtatish</button>`
        : `<button class="btn primary" onclick="AI.send()">Yuborish</button>`}
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn sm" onclick="document.getElementById('aiImg').click()">🖼 Rasm yuklash${this.img ? " ✓" : ""}</button>
          <input type="file" id="aiImg" accept="image/*" hidden onchange="AI.pickImage(this.files[0])">
          <button class="btn sm ghost" onclick="AI.turns=[];AI.paint()">🗑 Suhbatni tozalash</button>
          ${this.busy ? `<span class="small muted"><span class="spinner"></span> Javob yozilmoqda…</span>` : ""}
        </div>
      </div>`;
    const log = document.getElementById("aiLog"); if (log) log.scrollTop = log.scrollHeight;
  }
};

CH.start = function () {
  const seed = dayIndex();
  const ids = TOPICS.map(t => t.id);
  this.qs = [];
  for (let i = 0; i < 5; i++) {
    const tid = ids[(seed * 7 + i * 11) % ids.length];
    const lvl = 1 + ((seed + i) % 3);
    try { const p = GEN[tid](lvl); p.topic = tid; p.lvl = lvl; this.qs.push(p); } catch (e) { i--; }
  }
  this.idx = 0; this.score = 0; this.active = true; this.answered = false; this.val = "";
  this.paint();
};
CH.paint = function () {
  if (this.idx >= this.qs.length) {
    S.daily.challengeDone = true; S.challenges++;
    save(); checkBadges();
    if (!this._awarded) { this._awarded = true; addXp(this.score === 5 ? 100 : this.score * 15, "Challenge"); }
    V.innerHTML = `<div class="card" style="text-align:center;padding:34px">
      <div style="font-size:52px">${this.score === 5 ? "🏆" : "🎉"}</div>
      <h1>Challenge yakunlandi</h1>
      <p class="sub">Natija: <b>${this.score}/5</b> · ${this.score === 5 ? "+100 XP" : "+" + this.score * 15 + " XP"}</p>
      <button class="btn primary" onclick="CH.active=false;CH._awarded=false;go('home')">Bosh sahifaga</button></div>`;
    this.active = false;
    return;
  }
  const q = this.qs[this.idx];
  V.innerHTML = `
    <div class="spread"><h1 style="margin:0">🔥 Challenge</h1><span class="chip">${this.idx + 1} / 5 · ✅ ${this.score}</span></div>
    <div class="bar" style="margin:10px 0 16px"><i style="width:${(this.idx) / 5 * 100}%"></i></div>
    <div class="q-wrap">
      <div class="spread" style="margin-bottom:10px"><span class="pill ${["", "easy", "med", "hard"][q.lvl]}">${TOPIC_BY_ID[q.topic].name}</span>${speakBtn(q.text, "Eshitish")}</div>
      <div class="prose" style="font-size:16px;font-weight:600">${md(q.text)}</div>
      <div style="margin-top:14px">
        ${q.type === "mcq"
      ? q.options.map((o, i) => `<button class="opt ${this.answered ? (isCorrect(o, q.answer) ? "good" : (this.val === String(o) ? "bad" : "")) : (this.val === String(o) ? "sel" : "")}" onclick="CH.pick('${jss(String(o))}')" ${this.answered ? "disabled" : ""}><span class="lt">${"ABCD"[i]}</span><span>${md(String(o))}</span></button>`).join("")
      : `<input id="chIn" type="text" placeholder="Javob" value="${escapeHtml(this.val)}" oninput="CH.val=this.value" ${this.answered ? "disabled" : ""}>`}
      </div>
      ${this.answered ? `<div class="feedback ${this.ok ? "good" : "bad"}"><b>${this.ok ? "✅ To'g'ri!" : "❌ Noto'g'ri"}</b> To'g'ri javob: <b>${escapeHtml(q.answer)}</b>
        <ol class="steps">${q.steps.map(s => `<li>${md(s)}</li>`).join("")}</ol></div>` : ""}
      <div class="row" style="margin-top:14px">
        ${this.answered ? `<button class="btn primary" onclick="CH.next()">${this.idx === 4 ? "Yakunlash" : "Keyingi →"}</button>`
      : `<button class="btn primary" onclick="CH.check()">✓ Tekshirish</button>`}
      </div>
    </div>`;
};
CH.pick = function (v) { if (this.answered) return; this.val = v; this.paint(); };
CH.check = function () {
  const q = this.qs[this.idx];
  if (!String(this.val).trim()) return toast("Javobni kiriting");
  this.ok = isCorrect(this.val, q.answer);
  if (this.ok) this.score++;
  this.answered = true;
  recordAttempt(q.topic, this.ok, this.ok ? null : q, this.val);
  this.paint();
};
CH.next = function () { this.idx++; this.answered = false; this.val = ""; this.paint(); };

  const marks = S.bookmarks.filter(b => (b.title || "").toLowerCase().includes(q)).slice(0, 5);
  const pages = S.book.marks.length && ("sahifa".includes(q) || /\d/.test(q)) ? S.book.marks.filter(p => String(p).includes(q)).slice(0, 5) : [];

  knownBadges = earnedBadges().map(b => b.id);
  render();
  IDB.get("current").then(r => { if (r && r.buf && route.name === "book") Book.loadFromBuffer(r.buf, r.name); }).catch(() => { });
  AI.init();
  window.addEventListener("beforeunload", () => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { } });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", checkSession);
else checkSession();
</script>
